name: OpenCode

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

jobs:
  opencode:
    if: >-
      (github.event.sender.type != 'Bot') &&
      (github.event.issue.pull_request == null) &&
      (contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, '/goal') ||
      contains(github.event.issue.body, '/oc') ||
      contains(github.event.issue.body, '/opencode') ||
      contains(github.event.issue.body, '/goal') ||
      contains(github.event.issue.title, '/oc') ||
      contains(github.event.issue.title, '/opencode') ||
      contains(github.event.issue.title, '/goal'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      SSH_NAME: opencode-${{ github.run_id }}-ssh
      SSH_KEY: ${{ github.workspace }}/opencode-agentsweb-id_ed25519
      SSH_PUBLIC_KEY: ${{ github.workspace }}/opencode-agentsweb-id_ed25519.pub
      SSH_DIR: ${{ github.workspace }}/.opencode-ssh
      OPENCODE_WEB_PORT: 4096
      OPENCODE_PROXY_PORT: 4097
      OPENCODE_WEB_DIR: ${{ github.workspace }}/.opencode-web
      PROJECT_DIR: ${{ github.workspace }}/project
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_EXPERIMENTAL: "true"
      OPENCODE_ENABLE_EXA: "true"
      OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
      OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS: "true"
      OPENCODE_EXPERIMENTAL_WEBSOCKETS: "true"
      GH_TOKEN: ${{ github.token }}
      APP_PORT: 3000
      BRANCH_NAME: opencode/${{ github.run_id }}
      TRIGGER_ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body || github.event.issue.body || github.event.pull_request.body || github.event.issue.title || github.event.pull_request.title }}
      GOAL_REQUEST: ${{ contains(github.event.comment.body, '/goal') || contains(github.event.issue.body, '/goal') || contains(github.event.issue.title, '/goal') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # OpenCode must be able to push its generated branch/PR with GITHUB_TOKEN.
          persist-credentials: true

      - name: Checkout AgentsWeb tunnel client
        uses: actions/checkout@v6
        with:
          repository: agents-dev/agent-workspace
          path: .agentsweb
          sparse-checkout: |
            lolgames_tunnel
          persist-credentials: false

      - name: Checkout shared OpenCode skills
        uses: actions/checkout@v6
        with:
          repository: agents-dev/skills
          path: project/.agents
          fetch-depth: 1
          persist-credentials: false

      - name: Exclude shared skills from generated changes
        shell: bash
        run: echo '/project/.agents/' >> .git/info/exclude

      - name: Install worker instructions
        shell: bash
        run: |
          set -euo pipefail
          install -d "$PROJECT_DIR"
          cp "$GITHUB_WORKSPACE/agents.template.md" "$PROJECT_DIR/Agents.md"
          cmp --silent "$GITHUB_WORKSPACE/agents.template.md" "$PROJECT_DIR/Agents.md"

      - name: Sync OpenCode labels
        uses: actions/github-script@v7
        env:
          OPENCODE_MODEL: opencode/muse-spark-1.2-contributor-free
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const catalog = await fetch('https://models.opencode.ai/api.json').then(async (response) => {
              if (!response.ok) throw new Error(`OpenCode model catalog returned ${response.status}`);
              return response.json();
            });
            const models = Object.values(catalog.opencode?.models ?? {})
              .filter((model) => model.cost?.input === 0 && model.cost?.output === 0 && model.cost?.cache_read === 0)
              .map((model) => model.id)
              .filter(Boolean)
              .sort();
            if (!models.includes(process.env.OPENCODE_MODEL.slice('opencode/'.length))) {
              throw new Error(`Configured model is missing from the OpenCode catalog: ${process.env.OPENCODE_MODEL}`);
            }

            const skillsRoot = path.join(process.env.PROJECT_DIR, '.agents', 'skills');
            const skillNames = fs.existsSync(skillsRoot)
              ? fs.readdirSync(skillsRoot, { withFileTypes: true })
                  .filter((entry) => entry.isDirectory())
                  .filter((entry) => fs.existsSync(path.join(skillsRoot, entry.name, 'SKILL.md')))
                  .map((entry) => entry.name)
              : [];

            const labels = [
              { name: 'in progress', color: 'FBCA04', description: 'OpenCode workflow is running' },
              { name: 'complete', color: '0E8A16', description: 'OpenCode workflow completed successfully' },
              { name: 'failed', color: 'B60205', description: 'OpenCode workflow failed' },
              { name: '/Goal', color: '8A2BE2', description: 'OpenCode goal workflow request' },
              ...models.map((model) => ({
                name: `model/opencode/${model}`,
                color: '5319E7',
                description: `OpenCode model: opencode/${model}`
              })),
              ...skillNames.map((name) => ({
                name: `skill/${name}`,
                color: '1D76DB',
                description: `OpenCode skill: ${name}`
              }))
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            const managedPrefixes = ['model/', 'skill/'];
            const defaultLabels = new Set([
              'bug', 'documentation', 'duplicate', 'enhancement', 'good first issue',
              'help wanted', 'invalid', 'question', 'wontfix'
            ]);
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const desired = new Set(labels.map(({ name }) => name));
            for (const label of existing) {
              if (defaultLabels.has(label.name) ||
                  (managedPrefixes.some((prefix) => label.name.startsWith(prefix)) && !desired.has(label.name))) {
                await github.rest.issues.deleteLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              }
            }

            core.info(`Synchronized ${labels.length} labels from the live OpenCode catalog and shared skills`);

      - name: Mark issue in progress
        uses: actions/github-script@v7
        env:
          GOAL_REQUEST: ${{ env.GOAL_REQUEST }}
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            const statuses = ['in progress', 'complete', 'failed'];
            for (const status of statuses) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: number, name: status
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number,
              labels: ['in progress', ...(process.env.GOAL_REQUEST === 'true' ? ['/Goal'] : [])]
            });

      - name: Start AgentsWeb SSH session
        id: agentsweb
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT=$((32000 + GITHUB_RUN_NUMBER % 1000))
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y openssh-server tmux
          install -d -m 700 "$SSH_DIR"
          ssh-keygen -t ed25519 -f "$SSH_KEY" -N '' -q
          chmod 600 "$SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          {
            cat "$SSH_PUBLIC_KEY"
            printf '%s\n' '${{ secrets.AGENTSWEB_SSH_PUBLIC_KEY }}'
          } > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=no \
            -o PermitRootLogin=no -o PubkeyAuthentication=yes
          for _ in {1..20}; do
            ss -ltn | grep -q ':2222 ' && break
            sleep 1
          done
          ss -ltn | grep -q ':2222 '
          nohup env PYTHONPATH="$GITHUB_WORKSPACE/.agentsweb" \
            python3 -m lolgames_tunnel client 127.0.0.1:2222 \
            --server agentsweb.space --name "$SSH_NAME" --public-port "$SSH_PORT" \
            > "$SSH_DIR/tunnel.log" 2>&1 &
          echo $! > "$SSH_DIR/tunnel.pid"
          for _ in {1..45}; do
            grep -q 'agentsweb.space' "$SSH_DIR/tunnel.log" && break
            sleep 1
          done
          grep -q 'agentsweb.space' "$SSH_DIR/tunnel.log"
          SSH_HOST="${SSH_NAME}.agentsweb.space"
          SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/aiplay-agentsweb -p ${SSH_PORT} runner@${SSH_HOST}"
          printf 'host=%s\nport=%s\ncommand=%s\n' "$SSH_HOST" "$SSH_PORT" "$SSH_COMMAND" >> "$GITHUB_OUTPUT"

      - name: Start OpenCode web UI and Cloudflare tunnel
        id: opencode_web
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 "$OPENCODE_WEB_DIR"
          OPENCODE_VERSION="$(
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/anomalyco/opencode/releases/latest \
              | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p'
          )"
          [[ "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl --fail --silent --show-error --location https://opencode.ai/install \
            | bash -s -- --version "$OPENCODE_VERSION"
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          [[ -x "$OPENCODE_BIN" ]]
          install -d -m 700 "$HOME/.config/opencode"
          npm install --prefix "$HOME/.config/opencode" --no-save --no-package-lock \
            --ignore-scripts opencode-goal-plugin@0.8.2
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": [
              [
                "opencode-goal-plugin",
                {
                  "noInterruptOnUserMessage": true
                }
              ]
            ],
            "command": {
              "goal": {
                "description": "Set a session-scoped goal and auto-continue until complete.",
                "template": "$ARGUMENTS",
                "agent": "build"
              }
            },
            "permission": {
              "*": "allow",
              "task": "allow"
            }
          }
          EOF
          nohup "$OPENCODE_BIN" web --hostname 127.0.0.1 --port "$OPENCODE_WEB_PORT" \
            > "$OPENCODE_WEB_DIR/opencode.log" 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/opencode.pid"
          for _ in {1..45}; do
            curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:$OPENCODE_WEB_PORT/" >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:$OPENCODE_WEB_PORT/" >/dev/null
          sudo apt-get install -y nginx
          cat > "$OPENCODE_WEB_DIR/nginx.conf" <<EOF
          pid $OPENCODE_WEB_DIR/nginx.pid;
          events {}
          http {
            map \$http_upgrade \$connection_upgrade {
              default upgrade;
              '' close;
            }
            server {
              listen 127.0.0.1:$OPENCODE_PROXY_PORT;
              location / {
                proxy_set_header x-opencode-directory "$PROJECT_DIR";
                proxy_set_header Host \$host;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection \$connection_upgrade;
                proxy_pass http://127.0.0.1:$OPENCODE_WEB_PORT;
              }
            }
          }
          EOF
          nohup sudo nginx -c "$OPENCODE_WEB_DIR/nginx.conf" -g 'daemon off;' \
            > "$OPENCODE_WEB_DIR/nginx.log" 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/nginx.pid"
          for _ in {1..20}; do
            curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:$OPENCODE_PROXY_PORT/" >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:$OPENCODE_PROXY_PORT/" >/dev/null
          curl --fail --silent --show-error --location --output "$OPENCODE_WEB_DIR/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod 755 "$OPENCODE_WEB_DIR/cloudflared"
          nohup "$OPENCODE_WEB_DIR/cloudflared" tunnel --no-autoupdate --url "http://127.0.0.1:$OPENCODE_PROXY_PORT" \
            > "$OPENCODE_WEB_DIR/cloudflared.log" 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/cloudflared.pid"
          for _ in {1..60}; do
            WEB_URL="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' "$OPENCODE_WEB_DIR/cloudflared.log" | head -n 1)"
            [[ -n "$WEB_URL" ]] && break
            sleep 1
          done
          [[ -n "${WEB_URL:-}" ]]
          printf 'url=%s\n' "$WEB_URL" >> "$GITHUB_OUTPUT"

      - name: Verify shared skills are visible to OpenCode
        shell: bash
        run: |
          set -euo pipefail
          expected="$(find "$PROJECT_DIR/.agents/skills" -mindepth 2 -maxdepth 2 -name SKILL.md -type f | wc -l | tr -d ' ')"
          skills="$(curl --fail --silent --show-error \
            -H "x-opencode-directory: $PROJECT_DIR" \
            "http://127.0.0.1:$OPENCODE_PROXY_PORT/skill")"
          actual="$(jq 'length' <<<"$skills")"
          echo "OpenCode reported $actual skills; repository contains $expected shared skills."
          jq -e 'length > 0' <<<"$skills" >/dev/null
          [[ "$actual" -ge "$expected" ]]

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name 'opencode[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create OpenCode branch
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH='${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}'
          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BRANCH_NAME" "origin/$BASE_BRANCH"

      - name: Resolve OpenCode model and skill labels
        id: opencode_labels
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            const response = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100
            });
            const names = response.data.map(({ name }) => name);
            const modelLabels = names.filter((name) => name.startsWith('model/'));
            if (modelLabels.length > 1) {
              core.setFailed(`Expected at most one model/* label, found: ${modelLabels.join(', ')}`);
              return;
            }
            const model = modelLabels[0]?.slice('model/'.length) || 'opencode/muse-spark-1.2-contributor-free';
            const skills = names.filter((name) => name.startsWith('skill/'))
              .map((name) => name.slice('skill/'.length)).sort();
            core.setOutput('model', model);
            core.setOutput('skills_json', JSON.stringify(skills));
            core.info(`Resolved model=${model}; skills=${skills.join(', ') || '(none)'}`);

      - name: Run OpenCode and locate its web session
        id: opencode_run
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_WEB_URL: ${{ steps.opencode_web.outputs.url }}
          OPENCODE_MODEL: ${{ steps.opencode_labels.outputs.model }}
          OPENCODE_SKILLS: ${{ steps.opencode_labels.outputs.skills_json }}
          GOAL_REQUEST: ${{ env.GOAL_REQUEST }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          PROMPT_FILE="$OPENCODE_WEB_DIR/prompt.txt"
          RUN_LOG="$OPENCODE_WEB_DIR/opencode-run.log"
          RUN_EXIT="$OPENCODE_WEB_DIR/opencode-run.exit"
          skill_text="$(jq -r 'if length == 0 then "(none)" else join(", ") end' <<<"$OPENCODE_SKILLS")"
          prompt_template="$(< "$GITHUB_WORKSPACE/.github/prompts/build.md")"
          request_text="$COMMENT_BODY"
          if [[ "$GOAL_REQUEST" == 'true' ]]; then
            # The issue marker selects the custom command; do not include the
            # marker itself in the objective passed to the goal parser.
            request_text="$(sed -E 's/^[[:space:]]*\/goal([[:space:]]*)?//' <<<"$request_text")"
          fi
          prompt="${prompt_template//@COMMENT_BODY@/$request_text}"
          prompt="${prompt//@OPENCODE_MODEL@/$OPENCODE_MODEL}"
          prompt="${prompt//@SKILL_TEXT@/$skill_text}"
          printf '%s\n' "$prompt" > "$PROMPT_FILE"
          echo "OpenCode invocation mode: $([[ "$GOAL_REQUEST" == 'true' ]] && echo goal || echo standard)"
          # The inner shell expands the positional parameters after nohup starts.
          # shellcheck disable=SC2016
          nohup bash -c '
            if [[ "$7" == true ]]; then
              "$1" run --auto --dangerously-skip-permissions --attach "http://127.0.0.1:$2" --model "$6" --command goal "$(cat "$3")" > "$4" 2>&1
            else
              "$1" run --auto --dangerously-skip-permissions --attach "http://127.0.0.1:$2" --model "$6" "$(cat "$3")" > "$4" 2>&1
            fi
            code=$?
            echo "$code" > "$5"
            exit "$code"
          ' \
            _ "$OPENCODE_BIN" "$OPENCODE_WEB_PORT" "$PROMPT_FILE" "$RUN_LOG" "$RUN_EXIT" "$OPENCODE_MODEL" "$GOAL_REQUEST" \
            > /dev/null 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/opencode-run.pid"
          SESSION_ID=''
          for _ in {1..120}; do
            SESSION_ID="$(curl --fail --silent --show-error "http://127.0.0.1:$OPENCODE_WEB_PORT/session" | jq -r '.[0].id // empty')"
            [[ "$SESSION_ID" == ses_* ]] && break
            sleep 1
          done
          [[ "$SESSION_ID" == ses_* ]]
          DIRECTORY_B64="$(printf '%s' "$PROJECT_DIR" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          printf 'session_id=%s\nsession_url=%s\n' "$SESSION_ID" \
            "${OPENCODE_WEB_URL}/${DIRECTORY_B64}/session/${SESSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify live sessions through SSH
        id: verify_sessions
        shell: bash
        run: |
          set -euo pipefail
          echo "Expected session: ${{ steps.opencode_run.outputs.session_id }}"
          for _ in {1..12}; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 -o ConnectionAttempts=1 -i "$SSH_KEY" \
              -p "${{ steps.agentsweb.outputs.port }}" \
              "runner@${{ steps.agentsweb.outputs.host }}" \
              "curl --fail --silent --show-error -H 'x-opencode-directory: $PROJECT_DIR' http://127.0.0.1:$OPENCODE_WEB_PORT/session" \
              > "$OPENCODE_WEB_DIR/ssh-sessions.json"; then
              break
            fi
            sleep 5
          done
          [[ -s "$OPENCODE_WEB_DIR/ssh-sessions.json" ]]
          echo
          echo 'Sessions returned through SSH:'
          jq . "$OPENCODE_WEB_DIR/ssh-sessions.json"
          jq -e --arg session "${{ steps.opencode_run.outputs.session_id }}" \
            'any(.[]; .id == $session)' "$OPENCODE_WEB_DIR/ssh-sessions.json"

      - name: Post temporary access details
        id: access_comment
        uses: actions/github-script@v7
        env:
          SSH_COMMAND: ${{ steps.agentsweb.outputs.command }}
          SSH_HOST: ${{ steps.agentsweb.outputs.host }}
          SSH_PORT: ${{ steps.agentsweb.outputs.port }}
          OPENCODE_WEB_URL: ${{ steps.opencode_run.outputs.session_url }}
          GOAL_REQUEST: ${{ env.GOAL_REQUEST }}
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const command = process.env.GOAL_REQUEST === 'true' ? '/goal' : '/oc';
            const body = [
              '🔐 **Temporary AgentsWeb SSH session is ready.**', '',
              `Run: ${run}`, `Host: \`${process.env.SSH_HOST}:${process.env.SSH_PORT}\``, '',
              'Run this command while the job is active:', '',
              '```sh', process.env.SSH_COMMAND, '```', '',
              '🌐 **Live OpenCode web session is ready.**', '',
              `URL: ${process.env.OPENCODE_WEB_URL}`, '',
              `This opens the currently running ${command} session directly. Access remains available while OpenCode runs and for 5 hours afterwards.`
            ].join('\n');
            const result = await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body
            });
            core.setOutput('comment_id', result.data.id);

      - name: Start live OpenCode response comment
        id: response_comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ steps.access_comment.outputs.comment_id }}
          SESSION_ID: ${{ steps.opencode_run.outputs.session_id }}
          OPENCODE_WEB_URL: ${{ steps.opencode_run.outputs.session_url }}
          ISSUE_NUMBER: ${{ env.TRIGGER_ISSUE_NUMBER }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TRACKER="$OPENCODE_WEB_DIR/response-comment-tracker.sh"
          install -m 700 "$GITHUB_WORKSPACE/scripts/opencode-progress-tracker.sh" "$TRACKER"
          # The tracker is intentionally independent of the step shell so it can poll
          # while later workflow steps run; cleanup stops it at the end of the job.
          nohup env PROJECT_DIR="$PROJECT_DIR" OPENCODE_WEB_PORT="$OPENCODE_WEB_PORT" \
            OPENCODE_WEB_DIR="$OPENCODE_WEB_DIR" SESSION_ID="$SESSION_ID" \
            COMMENT_ID="$COMMENT_ID" REPOSITORY="$REPOSITORY" GH_TOKEN="$GH_TOKEN" \
            "$TRACKER" > "$OPENCODE_WEB_DIR/response-comment-tracker.log" 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/response-comment-tracker.pid"

      - name: Verify app with second OpenCode prompt
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          for _ in {1..21600}; do
            [[ -f "$OPENCODE_WEB_DIR/opencode-run.exit" ]] && break
            sleep 1
          done
          [[ -f "$OPENCODE_WEB_DIR/opencode-run.exit" ]]
          code="$(cat "$OPENCODE_WEB_DIR/opencode-run.exit")"
          echo "OpenCode exited with code $code"
          [[ "$code" == 0 ]]
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          "$OPENCODE_BIN" run \
            --auto \
            --dangerously-skip-permissions \
            --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
            --session "${{ steps.opencode_run.outputs.session_id }}" \
            --model "${{ steps.opencode_labels.outputs.model }}" \
            "$(< "$GITHUB_WORKSPACE/.github/prompts/verify.md")" \
            > "$OPENCODE_WEB_DIR/verification.log" 2>&1

      - name: Expose verified app
        id: app_tunnel
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          SESSION_ID='${{ steps.opencode_run.outputs.session_id }}'
          FIX_PROMPT='The browser verification cannot reach the app through its public trycloudflare.com URL. Diagnose the current app and fix the public runtime, including dev-server host/allowed-host configuration or startup scripts if needed. Keep the app self-contained under project/, run the relevant tests, and do not just explain the problem. Make the fix in the workspace so the next verification attempt can run.'

          for attempt in 1 2 3; do
            echo "Starting public app verification attempt $attempt/3."
            [[ ! -f "$OPENCODE_WEB_DIR/app.pid" ]] || kill "$(cat "$OPENCODE_WEB_DIR/app.pid")" 2>/dev/null || true
            [[ ! -f "$OPENCODE_WEB_DIR/app-cloudflared.pid" ]] || kill "$(cat "$OPENCODE_WEB_DIR/app-cloudflared.pid")" 2>/dev/null || true
            : > "$OPENCODE_WEB_DIR/app.log"
            : > "$OPENCODE_WEB_DIR/app-cloudflared.log"

            npm run start -- --port "$APP_PORT" >> "$OPENCODE_WEB_DIR/app.log" 2>&1 &
            echo $! > "$OPENCODE_WEB_DIR/app.pid"
            local_ok=''
            for _ in {1..30}; do
              if curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:$APP_PORT" >/dev/null; then
                local_ok='yes'
                break
              fi
              sleep 1
            done

            if [[ "$local_ok" != 'yes' ]]; then
              echo "Local app health check failed on attempt $attempt."
            else
              "$OPENCODE_WEB_DIR/cloudflared" tunnel --no-autoupdate \
                --url "http://127.0.0.1:$APP_PORT" \
                > "$OPENCODE_WEB_DIR/app-cloudflared.log" 2>&1 &
              echo $! > "$OPENCODE_WEB_DIR/app-cloudflared.pid"
              APP_URL=''
              for _ in {1..60}; do
                APP_URL="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' \
                  "$OPENCODE_WEB_DIR/app-cloudflared.log" | head -n 1)"
                [[ -n "$APP_URL" ]] && break
                sleep 1
              done
              public_app_ok=''
              if [[ -n "$APP_URL" ]]; then
                for _ in {1..60}; do
                  if curl --fail --silent --show-error --max-time 10 "$APP_URL" >/dev/null; then
                    public_app_ok='yes'
                    break
                  fi
                  sleep 2
                done
              fi
              if [[ "$public_app_ok" == 'yes' ]]; then
                echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
                echo "Public app verified at $APP_URL."
                exit 0
              fi
              echo "Public app health check failed on attempt $attempt ($APP_URL)."
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Sending OpenCode remediation prompt before retry $((attempt + 1))/3."
              "$OPENCODE_BIN" run --auto --dangerously-skip-permissions \
                --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
                --session "$SESSION_ID" \
                --model "$OPENCODE_MODEL" \
                "$FIX_PROMPT" \
                >> "$OPENCODE_WEB_DIR/verification-fix-$attempt.log" 2>&1
            fi
          done

          echo 'Public app verification failed after 3 attempts.'
          exit 1
        env:
          OPENCODE_MODEL: ${{ steps.opencode_labels.outputs.model }}

      - name: Publish worker completion report
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          "$OPENCODE_BIN" run --auto --dangerously-skip-permissions \
            --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
            --session "${{ steps.opencode_run.outputs.session_id }}" \
            --model "${{ steps.opencode_labels.outputs.model }}" \
            "The public game is verified at $APP_URL. Follow ./Agents.md now: capture and commit final playable-game screenshots under screenshots/ using final-* filenames, push the current branch, and post the final completion comment to issue #$TRIGGER_ISSUE_NUMBER. Include this public game URL, embedded screenshots, the final commit, deployment and test status, and known limitations. Do not create a pull request." \
            > "$OPENCODE_WEB_DIR/completion-report.log" 2>&1
          touch "$OPENCODE_WEB_DIR/response-comment.done"

      - name: Request and verify final screenshots
        id: final_evidence
        shell: bash
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          SESSION_ID='${{ steps.opencode_run.outputs.session_id }}'
          SCREENSHOT_PROMPT='The final screenshot evidence is still missing. Use the already verified public game and a real browser now, capture at least one meaningful playable-game screenshot, save it under screenshots/ with a filename beginning with final- (for example screenshots/final-gameplay.png), commit and push it on the current branch, and update the triggering issue with the immutable screenshot URL. Do not just explain or claim completion without creating the image. Keep all work inside project/ and do not create a pull request.'

          for attempt in 1 2 3; do
            mapfile -t screenshots < <(find "$PROJECT_DIR/screenshots" -maxdepth 1 -type f \
              \( -iname 'final-*.png' -o -iname 'final-*.jpg' -o -iname 'final-*.jpeg' -o -iname 'final-*.webp' \) \
              -printf '%f\n' 2>/dev/null | sort)
            if [[ "${#screenshots[@]}" -gt 0 ]]; then
              printf '%s\n' "${screenshots[@]}"
              printf 'screenshots_json=%s\n' "$(printf '%s\n' "${screenshots[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
              printf 'screenshots_status=present\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "No final screenshots found under project/screenshots/ (attempt $attempt/3)."
            if [[ "$attempt" -lt 3 ]]; then
              echo "Sending OpenCode screenshot remediation prompt before retry $((attempt + 1))/3."
              if ! "$OPENCODE_BIN" run --auto --dangerously-skip-permissions \
                --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
                --session "$SESSION_ID" \
                --model '${{ steps.opencode_labels.outputs.model }}' \
                "$SCREENSHOT_PROMPT" \
                > "$OPENCODE_WEB_DIR/screenshot-fix-$attempt.log" 2>&1; then
                echo "OpenCode screenshot remediation failed on attempt $attempt; continuing to the next evidence check."
              fi
            fi
          done

          echo 'Final screenshots are still missing after three remediation attempts; continuing with delivery.'
          printf 'screenshots_json=[]\n' >> "$GITHUB_OUTPUT"
          printf 'screenshots_status=missing\n' >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH='${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}'
          # Dependencies are runtime-only and must never be included in the generated PR.
          touch "$PROJECT_DIR/.gitignore"
          grep -qxF 'node_modules/' "$PROJECT_DIR/.gitignore" || \
            printf '\nnode_modules/\n' >> "$PROJECT_DIR/.gitignore"
          git add -A -- project
          if ! git diff --cached --quiet; then
            git commit -m "OpenCode: ${COMMENT_BODY%%$'\n'*}"
          fi
          if git diff --quiet "origin/$BASE_BRANCH..HEAD" -- project; then
            echo 'OpenCode made no changes; no pull request will be created.'
            exit 0
          fi
          git push --set-upstream origin "$BRANCH_NAME"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          TITLE="OpenCode: ${COMMENT_BODY%%$'\n'*}"
          TITLE="${TITLE:0:120}"
          PR_URL="$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body "Automated implementation requested in comment:\n\n$COMMENT_BODY")"
          printf 'commit=%s\npr_url=%s\n' "$FINAL_COMMIT" "$PR_URL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish game to OmGithub
        id: omgithub_publish
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          OMGITHUB_PUBLISH_TOKEN: ${{ secrets.OMGHITHUB_PUBLISH_TOKEN }}
          FINAL_COMMIT: ${{ steps.delivery.outputs.commit }}
          PR_URL: ${{ steps.delivery.outputs.pr_url }}
          SCREENSHOTS_JSON: ${{ steps.final_evidence.outputs.screenshots_json }}
        run: |
          set -euo pipefail
          [[ -n "$OMGHITHUB_PUBLISH_TOKEN" ]]
          [[ -f dist/index.html ]]
          [[ -n "$FINAL_COMMIT" ]]
          [[ "$PR_URL" =~ /pull/([0-9]+)$ ]]
          PR_NUMBER="${BASH_REMATCH[1]}"

          package_name="$(jq -r '.name // empty' package.json 2>/dev/null || true)"
          request_title="${COMMENT_BODY%%$'\n'*}"
          request_title="${request_title#/goal }"
          game_name="${package_name:-$request_title}"
          game_name="$(sed -E 's/[^[:alnum:]]+/-/g; s/^-+|-+$//g' <<<"$game_name" | tr '[:upper:]' '[:lower:]')"
          [[ -n "$game_name" ]] || game_name="game-$TRIGGER_ISSUE_NUMBER"

          screenshots="$(jq -c --arg owner "${GITHUB_REPOSITORY_OWNER}" --arg repo "${GITHUB_REPOSITORY#*/}" --arg commit "$FINAL_COMMIT" '
            map("https://raw.githubusercontent.com/\($owner)/\($repo)/\($commit)/project/screenshots/\(.)")
          ' <<<"${SCREENSHOTS_JSON:-[]}")"
          archive="$RUNNER_TEMP/omgithub-dist.zip"
          (cd dist && zip -q -r "$archive" .)
          response="$RUNNER_TEMP/omgithub-publish.json"
          curl --fail-with-body --silent --show-error \
            -X POST "https://omgithub.com/api/publish" \
            -H "Authorization: Bearer $OMGHITHUB_PUBLISH_TOKEN" \
            -H 'Content-Type: application/zip' \
            -H "X-OmGithub-Name: $game_name" \
            -H "X-OmGithub-Title: ${request_title:0:150}" \
            -H "X-OmGithub-Owner: $GITHUB_REPOSITORY_OWNER" \
            -H "X-OmGithub-Repo: ${GITHUB_REPOSITORY#*/}" \
            -H "X-OmGithub-Issue: $TRIGGER_ISSUE_NUMBER" \
            -H "X-OmGithub-PR: $PR_NUMBER" \
            -H "X-OmGithub-Commit: $FINAL_COMMIT" \
            -H "X-OmGithub-Actor: $GITHUB_ACTOR" \
            -H "X-OmGithub-Screenshots: $screenshots" \
            --data-binary "@$archive" > "$response"
          jq -e '.ok == true and .project.url and .project.install_url' "$response" >/dev/null
          published_url="$(jq -r '.project.url' "$response")"
          install_url="$(jq -r '.project.install_url' "$response")"
          curl --fail --silent --show-error --retry 10 --retry-delay 2 "$published_url" >/dev/null
          printf 'url=%s\ninstall_url=%s\n' "$published_url" "$install_url" >> "$GITHUB_OUTPUT"
          echo "Published permanent game URL: $published_url"

      - name: Create OpenCode logs release
        if: success()
        id: opencode_release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/opencode-release"
          mkdir -p "$release_dir"

          # Preserve machine-readable responses and execution logs without
          # publishing OpenCode configuration, credentials, or SSH material.
          curl --fail --silent --show-error \
            -H "x-opencode-directory: $PROJECT_DIR" \
            "http://127.0.0.1:$OPENCODE_WEB_PORT/session/${{ steps.opencode_run.outputs.session_id }}/message" \
            > "$release_dir/opencode-response.json"
          if [[ ! -s "$release_dir/opencode-response.json" ]]; then
            echo 'OpenCode response artifact is empty; refusing to create an incomplete release.' >&2
            exit 1
          fi
          find "$OPENCODE_WEB_DIR" -maxdepth 1 -type f \
            \( -name '*.log' -o -name '*.json' \) \
            ! -name 'opencode.json' \
            -size +0c \
            -exec cp -f {} "$release_dir/" \;

          release_assets=()
          while IFS= read -r -d '' asset; do
            release_assets+=("$asset")
          done < <(find "$release_dir" -maxdepth 1 -type f -size +0c -print0)
          ((${#release_assets[@]} > 0))

          tag="opencode-logs-${GITHUB_RUN_ID}"
          gh release create "$tag" "${release_assets[@]}" \
            --target "${{ steps.delivery.outputs.commit || github.sha }}" \
            --title "OpenCode logs for run #${GITHUB_RUN_NUMBER}" \
            --notes "Generated OpenCode response and execution logs for workflow run [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            --latest=false

          release_json="$(gh release view "$tag" --json url,assets)"
          printf 'url=%s\n' "$(jq -r '.url' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          printf 'assets_json=%s\n' "$(jq -c '[.assets[] | {name, url: .browserDownloadUrl}]' <<<"$release_json")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post final game report
        if: success() && env.APP_URL != ''
        uses: actions/github-script@v7
        env:
          APP_URL: ${{ env.APP_URL }}
          FINAL_COMMIT: ${{ steps.delivery.outputs.commit }}
          PR_URL: ${{ steps.delivery.outputs.pr_url }}
          SCREENSHOTS_JSON: ${{ steps.final_evidence.outputs.screenshots_json }}
          SCREENSHOTS_STATUS: ${{ steps.final_evidence.outputs.screenshots_status }}
          OPENCODE_RELEASE_URL: ${{ steps.opencode_release.outputs.url }}
          OPENCODE_RELEASE_ASSETS: ${{ steps.opencode_release.outputs.assets_json }}
          OMGITHUB_URL: ${{ steps.omgithub_publish.outputs.url }}
          OMGITHUB_INSTALL_URL: ${{ steps.omgithub_publish.outputs.install_url }}
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.FINAL_COMMIT}`;
            const screenshots = JSON.parse(process.env.SCREENSHOTS_JSON || '[]');
            const releaseAssets = JSON.parse(process.env.OPENCODE_RELEASE_ASSETS || '[]');
            const images = screenshots.map((name) => {
              const path = `project/screenshots/${name}`.split('/').map(encodeURIComponent).join('/');
              const url = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${process.env.FINAL_COMMIT}/${path}`;
              return `![Final game screenshot: ${name}](${url})`;
            });
            const screenshotStatus = process.env.SCREENSHOTS_STATUS === 'present'
              ? 'Final screenshot evidence: present.'
              : 'Final screenshot evidence: missing after two automated follow-ups; the task completed, but screenshot capture still needs attention.';
            const body = [
              '✅ **Game complete and publicly verified.**', '',
              `Public game: ${process.env.OMGHITHUB_URL}`,
              `Install: ${process.env.OMGHITHUB_INSTALL_URL}`,
              `Temporary verification preview: ${process.env.APP_URL}`,
              `Final commit: ${commitUrl}`,
              `Pull request: ${process.env.PR_URL}`,
              `OpenCode logs release: ${process.env.OPENCODE_RELEASE_URL}`,
              '', '### OpenCode response and logs', '',
              ...releaseAssets.map(({ name, url }) => `- [${name}](${url})`),
              'Deployment status: verified through the public URL.',
              screenshotStatus,
              'Known limitations: see the worker progress and completion notes above.',
              '', '### Final screenshots', '', ...images
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body
            });

      - name: Mark issue complete
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number, name: 'in progress'
            }).catch((error) => { if (error.status !== 404) throw error; });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number, labels: ['complete']
            });

      - name: Mark issue failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number, name: 'in progress'
            }).catch((error) => { if (error.status !== 404) throw error; });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number, labels: ['failed']
            });

      - name: Keep temporary access available for 5 hours
        if: success()
        shell: bash
        run: sleep 18000

      - name: Append SSH session closed
        if: always() && steps.access_comment.outputs.comment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔒 **AgentsWeb SSH session closed.**\n\nTemporary access for [run #${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) has expired.`
            });

      - name: Clean up AgentsWeb SSH session
        if: always()
        shell: bash
        run: |
          set +e
          [[ -f "$OPENCODE_WEB_DIR/cloudflared.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/cloudflared.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/nginx.pid" ]] && sudo kill "$(cat "$OPENCODE_WEB_DIR/nginx.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/opencode.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/opencode.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/opencode-run.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/opencode-run.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/response-comment-tracker.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/response-comment-tracker.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/app-cloudflared.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/app-cloudflared.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/app.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/app.pid")" 2>/dev/null || true
          tmux kill-session -t app-server 2>/dev/null || true
          [[ -f "$SSH_DIR/tunnel.pid" ]] && kill "$(cat "$SSH_DIR/tunnel.pid")" 2>/dev/null || true
          sudo pkill -f 'sshd.*2222' 2>/dev/null || true
          rm -f "$SSH_KEY" "$SSH_PUBLIC_KEY"
          rm -rf "$SSH_DIR" "$HOME/.ssh/authorized_keys"
          rm -rf "$OPENCODE_WEB_DIR"
