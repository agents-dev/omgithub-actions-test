name: OpenCode
run-name: "OpenCode #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: ${{ github.event.label.name == 'OpenCode' && format('opencode-issue-{0}-{1}', github.repository, github.event.issue.number) || format('opencode-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.label.name == 'OpenCode'
    permissions:
      contents: read
      issues: write
      actions: read
      id-token: write
    uses: AgentsLoop/OhMyGithub/.github/workflows/opencode-prepare.yml@6184c4598055939fca52f81ee8b2ffa83dc129fa
    with:
      runtime_ref: 6184c4598055939fca52f81ee8b2ffa83dc129fa

  opencode:
    needs: prepare
    if: needs.prepare.outputs.approved == 'true'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: AgentsLoop/OhMyGithub/.github/workflows/opencode-reusable.yml@6184c4598055939fca52f81ee8b2ffa83dc129fa
    with:
      runtime_ref: 6184c4598055939fca52f81ee8b2ffa83dc129fa
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      request: ${{ needs.prepare.outputs.request }}
      issue_title: ${{ needs.prepare.outputs.issue_title }}
      labels_json: ${{ needs.prepare.outputs.labels_json }}
      sender: ${{ needs.prepare.outputs.sender }}
      target_ref: ${{ needs.prepare.outputs.target_ref }}
      target_sha: ${{ needs.prepare.outputs.target_sha }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
      AGENTSWEB_SSH_PUBLIC_KEY: ${{ secrets.AGENTSWEB_SSH_PUBLIC_KEY }}
