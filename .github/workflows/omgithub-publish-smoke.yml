name: OmGithub publish smoke

on:
  workflow_dispatch:
    inputs:
      name:
        description: Published game slug
        required: true
        default: omgithub-action-smoke
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Build fixture dist
        env:
          GAME_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '<!doctype html><title>%s</title><h1>OmGithub action smoke</h1>\n' "$GAME_NAME" > dist/index.html
          printf '{"name":"%s","start_url":"/"}\n' "$GAME_NAME" > dist/manifest.json
          zip -qr game-dist.zip dist

      - name: Publish fixture to OmGithub
        env:
          OMGITHUB_PUBLISH_TOKEN: ${{ secrets.OMGHITHUB_PUBLISH_TOKEN }}
          GAME_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          test -n "$OMGHITHUB_PUBLISH_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST https://omgithub.com/api/publish \
            -H "Authorization: Bearer $OMGHITHUB_PUBLISH_TOKEN" \
            -H 'Content-Type: application/zip' \
            -H "X-OmGithub-Name: $GAME_NAME" \
            -H 'X-OmGithub-Title: OmGithub action smoke' \
            -H 'X-OmGithub-Description: Published by the dedicated Actions smoke workflow.' \
            -H "X-OmGithub-Owner: $GITHUB_REPOSITORY_OWNER" \
            -H "X-OmGithub-Repo: ${GITHUB_REPOSITORY#*/}" \
            -H 'X-OmGithub-Issue: smoke' \
            -H 'X-OmGithub-PR: smoke' \
            -H "X-OmGithub-Commit: $GITHUB_SHA" \
            -H "X-OmGithub-Actor: $GITHUB_ACTOR" \
            --data-binary @game-dist.zip | tee publish.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('publish.json')); if (!r.url || !r.install_url) process.exit(1); console.log('Published:', r.url); console.log('Install:', r.install_url)"
